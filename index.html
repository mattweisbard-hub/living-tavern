<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Silver Lantern</title><style>
*{box-sizing:border-box}body{margin:0;background:#171713;color:#e6dcc6;font:15px system-ui}header{padding:22px 4%;border-bottom:1px solid #514331;display:flex;justify-content:space-between;align-items:center}h1,h2{font-family:Georgia;margin:0}small{color:#a99b81}main{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;padding:22px 4%}section{background:#24231d;border:1px solid #504332;border-radius:12px;padding:16px}button,input{font:inherit;border:1px solid #66553c;border-radius:6px;padding:10px;background:#332b20;color:#eee0c7}button{cursor:pointer}button:hover,button.active{background:#765b35}button:disabled{opacity:.5}input{flex:1;min-width:0}svg{display:block;width:100%;background:#292015;border-radius:8px}#log{height:260px;overflow:auto}.entry{border-bottom:1px solid #443a2d;padding:9px 0}.entry b{color:#e5b76a}#people{display:flex;gap:5px;flex-wrap:wrap}#inspect{white-space:pre-wrap;overflow:auto;max-height:240px;font:13px system-ui;color:#c9bda8}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#status{color:#e2b775}@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body><header><div><small>THE LIVING WORLD · PROTOTYPE 01</small><h1>The Silver Lantern</h1></div><div><small id=mode>Connecting…</small><br><button id=ai>Enable local AI</button></div></header><main><section><h2>The tavern</h2><p><small>Click a character to speak. A merchant's shipment has vanished.</small></p><svg viewBox="0 0 600 390" aria-label="Top down tavern map"><defs><pattern id=wood width=600 height=24 patternUnits=userSpaceOnUse><rect width=600 height=24 fill="#59422c"/><path d="M0 23H600" stroke="#382a20"/></pattern></defs><rect x=15 y=15 width=570 height=360 rx=8 fill="url(#wood)" stroke="#9a7651" stroke-width=12/><rect x=35 y=30 width=240 height=60 rx=7 fill="#291d17" stroke="#b18a56" stroke-width=3/><text x=155 y=65 fill="#dec39a" text-anchor=middle>BAR</text><rect x=445 y=30 width=110 height=60 rx=8 fill="#34221b" stroke="#c2854a" stroke-width=4/><text x=500 y=65 fill="#ecaa61" text-anchor=middle>FIREPLACE</text><g fill="#34241b" stroke="#b18a56" stroke-width=3><circle cx=180 cy=210 r=48/><circle cx=420 cy=235 r=48/></g><rect x=270 y=365 width=65 height=15 fill="#171713"/><text x=302 y=350 text-anchor=middle fill="#e4c39a">EXIT</text><g id=markers></g></svg><div id=people class=controls></div><div class=controls><input id=message placeholder="Say anything to the selected NPC…" maxlength=500><button id=send>Speak</button></div><div class=controls><button id=step>Advance one NPC decision</button><button id=auto>Start autonomous mode</button><button id=reset>Reset world</button></div><small id=status></small></section><section><h2>Conversations &amp; events</h2><div id=log></div><h2 style="margin-top:18px">Developer inspector</h2><p><small>Private character knowledge (not available to other NPCs).</small></p><div id=inspect></div></section></main><script>
let state,selected='edmund',busy=false,auto=false,localAI=false,model=null;const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';const positions={bar:[150,130],table:[180,285],door:[300,305],fire:[500,140]};function choose(id){selected=id;render()}function render(){if(!state)return;$('mode').textContent=localAI?'LOCAL AI · Qwen 0.5B (CPU)':state.mode==='demo'?'SCRIPTED DEMO · no LLM':state.model+' · '+state.mode;$('people').replaceChildren();$('markers').replaceChildren();state.npcs.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n.name+' · '+n.role;b.className=selected===n.id?'active':'';b.onclick=()=>choose(n.id);$('people').append(b);let [x,y]=positions[n.place];x+=i*30-45;let g=document.createElementNS(ns,'g');g.setAttribute('transform','translate('+x+' '+y+')');g.style.cursor='pointer';g.onclick=()=>choose(n.id);g.setAttribute('role','button');g.setAttribute('aria-label',n.name);g.setAttribute('tabindex','0');g.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')choose(n.id)};
let art=document.createElementNS(ns,'g');art.innerHTML='<ellipse cx="0" cy="25" rx="23" ry="8" fill="#1b140e" opacity=".65"/><circle r="30" fill="#f5d999" opacity=".12" stroke="#e9c68a" stroke-width="2"/><path d="M-9 12 L-10 27 M9 12 L10 27" stroke="#241e19" stroke-width="9" stroke-linecap="round"/><path d="M-14 -6 Q0 -16 14 -6 L18 16 Q0 23 -18 16Z" fill="'+n.color+'" stroke="#211a15" stroke-width="2"/><path d="M-14 0 L-23 12 M14 0 L23 12" stroke="'+n.color+'" stroke-width="8" stroke-linecap="round"/><circle cy="-17" r="11" fill="#deb18b" stroke="#3a271d" stroke-width="2"/><path d="M-10 -20 Q0 -35 11 -20 L11 -16 Q0 -23 -10 -16Z" fill="#493126"/><path d="M-4 -16h1 M4 -16h1" stroke="#30231e" stroke-width="2"/><path d="M-15 7H15" stroke="#35281b" stroke-width="4"/>';if(selected===n.id){let ring=document.createElementNS(ns,'circle');ring.setAttribute('r','34');ring.setAttribute('fill','none');ring.setAttribute('stroke','#fff0bf');ring.setAttribute('stroke-width','3');g.append(ring)}g.append(art);let t=document.createElementNS(ns,'text');t.setAttribute('y',45);t.setAttribute('text-anchor','middle');t.setAttribute('fill','#fff1d4');t.setAttribute('font-size',15);t.setAttribute('font-weight','bold');t.setAttribute('paint-order','stroke');t.setAttribute('stroke','#21170f');t.setAttribute('stroke-width','4');t.textContent=n.name;g.append(t);$('markers').append(g)});$('log').replaceChildren();state.events.forEach(e=>{let d=document.createElement('div');d.className='entry';let b=document.createElement('b');b.textContent=e.tick+' · '+e.speaker+' → '+e.target+' ['+e.action+']';d.append(b,document.createElement('br'),document.createTextNode(e.dialogue));if(e.target==='player')d.append(document.createElement('br'),document.createTextNode('You: '+e.input));$('log').append(d)});$('log').scrollTop=$('log').scrollHeight;let n=state.npcs.find(x=>x.id===selected);$('inspect').textContent=[n.name+' / '+n.trait,'Goal: '+n.goal,'Secret: '+n.secret,'Trust: '+JSON.stringify(n.trust),'Memories: '+JSON.stringify(n.memory,null,2),'LLM calls: '+state.calls+' · last latency: '+(state.last_latency??'—')+'s'].join('\n')}
$('ai').onclick=async()=>{if(busy)return;if(localAI){localAI=false;$('ai').textContent='Enable local AI';render();return}busy=true;$('ai').disabled=true;try{$('status').textContent='Downloading CPU model (first run only)…';if(!model){const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2');env.allowLocalModels=false;env.backends.onnx.wasm.numThreads=1;model=await pipeline('text-generation','onnx-community/Qwen2.5-0.5B-Instruct',{device:'wasm',dtype:'q4',progress_callback:p=>{if(p.status==='progress')$('status').textContent='Downloading '+p.file+' '+Math.round(p.progress||0)+'%'}})}localAI=true;$('ai').textContent='Disable local AI';$('status').textContent='Local model ready';render()}catch(e){$('status').textContent='Model initialization failed: '+e.message}finally{busy=false;$('ai').disabled=false}};
async function localDecision(body){let autoTurn=body.npc==='auto',p=autoTurn?state.npcs[state.tick%4]:state.npcs.find(n=>n.id===body.npc),q=autoTurn?state.npcs[(state.tick+1)%4]:null,target=q?q.id:'player';let msg=q?'Choose your next action toward '+q.name+' at '+q.place+' in pursuit of your goal.':body.message;let prompt='You are '+p.name+', '+p.role+'. Personality: '+p.trait+'. Goal: '+p.goal+'. Private knowledge: '+p.secret+'. A shipment is missing. Recent memories: '+JSON.stringify(p.memory.slice(-3))+'. Trust: '+p.trust[target]+'. Reply in character. Choose an action: speak, ask, refuse, move, wait. Return JSON only: {"dialogue":"short sentence","action":"speak","place":"bar","trust_delta":0}. Places: bar, table, door, fire.';let start=performance.now();let result=await model([{role:'system',content:prompt},{role:'user',content:msg}],{max_new_tokens:100,do_sample:false,return_full_text:false});let raw=result[0].generated_text;if(Array.isArray(raw))raw=raw[raw.length-1].content;let match=String(raw).match(/\{[\s\S]*\}/);let d;if(match){try{d=JSON.parse(match[0])}catch{}}if(!d||typeof d.dialogue!=='string')throw Error('Model returned an invalid decision. Try again or disable local AI.');return {...body,decision:d,tick:state.tick,latency:(performance.now()-start)/1000}}
async function call(path,body){if(busy)return;busy=true;$('status').textContent='Processing…';try{if(localAI&&path==='/api/turn')body=await localDecision(body);let r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.error||r.status);state=d;render();$('status').textContent='Ready'}catch(e){$('status').textContent=e.message;auto=false;$('auto').textContent='Start autonomous mode'}finally{busy=false}}
$('send').onclick=()=>{let m=$('message').value.trim();if(m&&!busy){$('message').value='';call('/api/turn',{npc:selected,message:m})}};$('message').onkeydown=e=>{if(e.key==='Enter')$('send').click()};$('step').onclick=()=>call('/api/turn',{npc:'auto'});$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'Pause autonomous mode':'Start autonomous mode'};$('reset').onclick=()=>{if(!busy&&confirm('Erase this world?')){auto=false;$('auto').textContent='Start autonomous mode';call('/api/reset',{})}};setInterval(()=>{if(auto&&!busy)call('/api/turn',{npc:'auto'})},3000);call('/api/state');
</script></body></html>
