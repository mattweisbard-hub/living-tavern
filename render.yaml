services:
  - type: web
    name: living-tavern
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: MODE
        value: demo
      - key: SECRET_KEY
        generateValue: true
